server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/vidyasetu_local}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD}

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: existing-local-schema-baseline
    validate-on-migrate: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

app:
  env: local

  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000
      - http://localhost:8081

  jwt:
    secret: ${JWT_SECRET:local-dev-secret-change-before-staging}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:120}

  storage:
    mode: local
    local-upload-dir: ${LOCAL_UPLOAD_DIR:./uploads}
