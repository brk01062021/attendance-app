spring.application.name=attendance-app
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

server.address=0.0.0.0
server.port=${SERVER_PORT:8080}

# Parent OTP SMS Delivery - MSG91 primary, Twilio fallback only if MSG91 is not configured
vidyasetu.sms.enabled=true
vidyasetu.sms.default-country-code=+91
vidyasetu.sms.msg91.auth-key=${MSG91_AUTH_KEY:}
vidyasetu.sms.msg91.template-id=${MSG91_TEMPLATE_ID:}
vidyasetu.sms.msg91.sender-id=${MSG91_SENDER_ID:VIDYST}
vidyasetu.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
vidyasetu.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
vidyasetu.sms.twilio.from-number=${TWILIO_FROM_NUMBER:}
