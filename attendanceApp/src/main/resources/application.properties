spring.application.name=attendance-app
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

server.address=0.0.0.0
server.port=${SERVER_PORT:8080}

# Parent OTP SMS Delivery
vidyasetu.sms.enabled=true
vidyasetu.sms.provider=msg91
vidyasetu.sms.default-country-code=+91

# MSG91 Configuration
vidyasetu.sms.msg91.auth-key=${MSG91_AUTH_KEY}
vidyasetu.sms.msg91.widget-id=${MSG91_WIDGET_ID}
vidyasetu.sms.msg91.widget-token=${MSG91_WIDGET_TOKEN}
vidyasetu.sms.msg91.sender-id=${MSG91_SENDER_ID:VIDYST}