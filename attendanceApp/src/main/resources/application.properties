spring.application.name=attendance-app
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

server.address=0.0.0.0
server.port=${SERVER_PORT:8080}

# Parent OTP SMS Delivery - Twilio only
vidyasetu.sms.enabled=true
vidyasetu.sms.default-country-code=+91
vidyasetu.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
vidyasetu.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
vidyasetu.sms.twilio.from-number=${TWILIO_FROM_NUMBER:}
