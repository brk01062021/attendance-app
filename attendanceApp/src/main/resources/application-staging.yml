server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: existing-staging-schema-baseline
    validate-on-migrate: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

app:
  env: staging

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

  jwt:
    secret: ${JWT_SECRET}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:60}

  storage:
    mode: s3

  aws:
    region: ${AWS_REGION}
    s3-upload-bucket: ${S3_UPLOAD_BUCKET}
